[package]
name = "seam-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Semantic capability decision plane for agents and existing gateways"

[workspace]
resolver = "3"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
